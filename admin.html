<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>管理</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar"><div class="container">
<a href="index.html" class="logo">品牌名</a>
<ul class="nav-links">
<li><a href="index.html">首页</a></li>
<li><a href="products.html">商品</a></li>
<li><a href="admin.html" style="color:#e63946;">管理</a></li>
</ul>
</div></nav>

<div style="max-width:600px;margin:40px auto;padding:0 20px;">
<h2>简易商品管理</h2>
<p style="color:#888;margin-bottom:20px;">直接在文本框里编辑 JSON，改完点发布</p>

<div style="background:#fff3cd;border:1px solid #ffc107;border-radius:8px;padding:12px;margin-bottom:16px;">
<label style="font-weight:600;display:block;margin-bottom:4px;">GitHub Token</label>
<input id="tk" type="password" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:6px;box-sizing:border-box;">
</div>

<div id="msg" style="display:none;padding:12px;border-radius:8px;margin-bottom:12px;"></div>

<p style="margin-bottom:8px;font-weight:600;">商品数据 (JSON 格式)</p>
<textarea id="data" style="width:100%;height:400px;padding:12px;border:1px solid #ddd;border-radius:8px;font-family:monospace;font-size:13px;box-sizing:border-box;resize:vertical;"></textarea>

<div style="margin-top:12px;">
<button class="btn" onclick="doPub()">发布</button>
<button class="btn" style="background:#6c757d;" onclick="doLoad()">加载</button>
</div>
</div>

<script>
var tk = document.getElementById('tk');
var ta = document.getElementById('data');
var msg = document.getElementById('msg');

tk.value = localStorage.getItem('_tk') || '';

function show(text, cls) {
  msg.textContent = text;
  msg.style.display = 'block';
  msg.className = cls || '';
  msg.style.background = cls === 'err' ? '#f8d7da' : cls === 'ok' ? '#d4edda' : '#cce5ff';
  msg.style.color = cls === 'err' ? '#721c24' : cls === 'ok' ? '#155724' : '#004085';
}

function esc(s) { return s.replace(/[<>&]/g, function(c) { return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c]; }); }

function b64(s) { return btoa(unescape(encodeURIComponent(s))); }

async function doPub() {
  var token = tk.value.trim();
  if (!token) { show('请填 Token', 'err'); return; }
  localStorage.setItem('_tk', token);

  var data;
  try { data = JSON.parse(ta.value); } catch(e) { show('JSON 格式错误：' + e.message, 'err'); return; }
  if (!Array.isArray(data) || data.length === 0) { show('至少填一个商品', 'err'); return; }

  show('发布中...', '');

  var items = data.map(function(p, i) {
    return '    {\n' +
      "      id: 'p" + Date.now() + i + "',\n" +
      "      name: '" + esc(String(p.name || '')).replace(/'/g, "\\'") + "',\n" +
      "      price: " + (parseFloat(p.price) || 0) + ",\n" +
      (p.originalPrice ? "      originalPrice: " + parseFloat(p.originalPrice) + ",\n" : '') +
      (p.badge ? "      badge: '" + esc(String(p.badge)).replace(/'/g, "\\'") + "',\n" : '') +
      "      description: '" + esc(String(p.description || '')).replace(/'/g, "\\'") + "',\n" +
      "      images: ['" + (p.image || 'placeholder.svg') + "']\n" +
      '    }';
  });

  var js = 'const products = [\n' + items.join(',\n') + '\n];\n\n' +
    'function renderProductCard(product) {\n' +
    '  const imgFile = product.images && product.images[0] ? product.images[0] : "placeholder.svg";\n' +
    '  return `<a href="product.html?id=${product.id}" class="product-card"><img src="images/${imgFile}" alt="${product.name}"><div class="info">${product.badge ? `<span class="badge">${product.badge}</span>` : ""}<h3>${product.name}</h3><span class="price">¥${product.price}</span>${product.originalPrice ? `<span class="original-price">¥${product.originalPrice}</span>` : ""}</div></a>`;\n' +
    '}\n\n' +
    'function renderProducts(productList, elementId) {\n' +
    '  const container = document.getElementById(elementId);\n' +
    '  if (!container) return;\n' +
    '  container.innerHTML = productList.map(p => renderProductCard(p)).join("");\n' +
    '}\n';

  try {
    var r = await fetch('https://api.github.com/repos/kkkill-pp/store-site/contents/js/products.js', {
      headers: { 'Authorization': 'token ' + token }
    });
    var d = await r.json();
    if (d.message) { show('GitHub 错误：' + d.message, 'err'); return; }

    var r2 = await fetch('https://api.github.com/repos/kkkill-pp/store-site/contents/js/products.js', {
      method: 'PUT',
      headers: { 'Authorization': 'token ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: '更新商品', content: b64(js), sha: d.sha })
    });
    if (r2.ok) { show('发布成功！1-2 分钟生效', 'ok'); }
    else { var e = await r2.json(); show('发布失败：' + (e.message || ''), 'err'); }
  } catch(e) { show('网络错误：' + e.message, 'err'); }
}

async function doLoad() {
  var token = tk.value.trim();
  if (!token) { show('请填 Token', 'err'); return; }
  show('加载中...', '');
  try {
    var r = await fetch('https://api.github.com/repos/kkkill-pp/store-site/contents/js/products.js', {
      headers: { 'Authorization': 'token ' + token }
    });
    var d = await r.json();
    if (d.message) { show('加载失败：' + d.message, 'err'); return; }
    var c = decodeURIComponent(escape(atob(d.content)));
    var m = c.match(/const products\s*=\s*(\[[\s\S]*?\]);/);
    if (m) {
      var items = eval(m[1]);
      ta.value = JSON.stringify(items.map(function(p) {
        return { name: p.name, price: p.price, originalPrice: p.originalPrice, badge: p.badge, description: p.description, image: (p.images && p.images[0]) || '' };
      }), null, 2);
      show('已加载 ' + items.length + ' 个商品', 'ok');
    } else { show('解析失败', 'err'); }
  } catch(e) { show('加载失败：' + e.message, 'err'); }
}
</script>
</body>
</html>
