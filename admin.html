<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鍟嗗搧绠＄悊 | 绠＄悊鍛?/title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .admin-wrap { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
    .admin-wrap h1 { margin-bottom: 24px; }
    .admin-wrap h2 { margin: 32px 0 16px; font-size: 1.2rem; }

    .token-bar {
      background: #fff3cd; border: 1px solid #ffc107; border-radius: 8px;
      padding: 16px; margin-bottom: 24px;
    }
    .token-bar label { display: block; margin-bottom: 8px; font-weight: 600; }
    .token-bar input { width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.9rem; }
    .token-bar .hint { font-size: 0.8rem; color: #856404; margin-top: 6px; }

    .admin-form { background: #f8f9fa; border-radius: 10px; padding: 24px; margin-bottom: 24px; }
    .admin-form .row { margin-bottom: 12px; }
    .admin-form label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 0.9rem; }
    .admin-form input, .admin-form textarea {
      width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.95rem;
    }
    .admin-form textarea { min-height: 60px; resize: vertical; }
    .admin-form .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .admin-form .row-3 { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 12px; }

    .admin-form .btn { margin-top: 12px; }
    .btn-secondary { background: #6c757d; }
    .btn-secondary:hover { background: #5a6268; }
    .btn-danger { background: #dc3545; }
    .btn-danger:hover { background: #c82333; }

    .product-list .item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px; border: 1px solid #eee; border-radius: 8px; margin-bottom: 8px;
    }
    .product-list .item .info { flex: 1; }
    .product-list .item .name { font-weight: 600; }
    .product-list .item .meta { font-size: 0.85rem; color: #888; }
    .product-list .item .actions { display: flex; gap: 8px; }
    .product-list .item .actions button { padding: 4px 12px; font-size: 0.85rem; }

    .status-msg { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; display: none; }
    .status-msg.success { background: #d4edda; color: #155724; display: block; }
    .status-msg.error { background: #f8d7da; color: #721c24; display: block; }
    .status-msg.loading { background: #cce5ff; color: #004085; display: block; }

    /* 鍥剧墖涓婁紶 */
    .upload-area {
      border: 2px dashed #ccc; border-radius: 8px; padding: 20px;
      text-align: center; cursor: pointer; transition: all 0.2s; margin-bottom: 8px;
    }
    .upload-area:hover { border-color: #1a1a2e; background: #f0f0f5; }
    .upload-area.has-image { border-color: #28a745; background: #f0fff4; padding: 12px; }
    .upload-area img { max-width: 150px; max-height: 150px; border-radius: 6px; margin-bottom: 8px; }
    .upload-area .hint { font-size: 0.85rem; color: #888; }
    #image-input { display: none; }
    .upload-status { font-size: 0.85rem; color: #28a745; margin-top: 4px; display: none; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">鍝佺墝鍚?/a>
      <ul class="nav-links">
        <li><a href="index.html">棣栭〉</a></li>
        <li><a href="products.html">鍟嗗搧</a></li>
        <li><a href="admin.html" style="color:#e63946;">绠＄悊</a></li>
      </ul>
    </div>
  </nav>

  <div class="admin-wrap">
    <h1>鍟嗗搧绠＄悊</h1>

    <!-- Token -->
    <div class="token-bar">
      <label>GitHub Token锛堥渶瑕?repo 鏉冮檺锛?/label>
      <input type="password" id="github-token" placeholder="杈撳叆浣犵殑 GitHub Personal Access Token" value="">
      <div class="hint">Token 鍙瓨鍦ㄤ綘娴忚鍣ㄩ噷銆傚～涓€娆″氨琛岋紝鍒锋柊椤甸潰涓嶄細涓€?/div>
    </div>

    <div id="status-msg" class="status-msg"></div>

    <!-- 娣诲姞/缂栬緫琛ㄥ崟 -->
    <div class="admin-form" id="product-form">
      <h2 id="form-title">娣诲姞鍟嗗搧</h2>
      <input type="hidden" id="edit-id" value="">
      <div class="row">
        <label>鍟嗗搧鍚嶇О</label>
        <input type="text" id="prod-name" placeholder="绀轰緥鍟嗗搧 1">
      </div>
      <div class="row-3">
        <div>
          <label>鍞环 (楼)</label>
          <input type="number" id="prod-price" placeholder="128">
        </div>
        <div>
          <label>鍘熶环 (楼)</label>
          <input type="number" id="prod-original" placeholder="188锛堢暀绌烘棤鍘熶环锛?>
        </div>
        <div>
          <label>瑙掓爣</label>
          <input type="text" id="prod-badge" placeholder="SAVE 30%锛堢暀绌烘棤瑙掓爣锛?>
        </div>
      </div>
      <div class="row">
        <label>鍟嗗搧鎻忚堪</label>
        <textarea id="prod-desc" placeholder="鍟嗗搧鎻忚堪鏂囧瓧"></textarea>
      </div>

      <!-- 鍥剧墖涓婁紶 -->
      <div class="row">
        <label>鍟嗗搧鍥剧墖</label>
        <div class="upload-area" id="upload-area" onclick="document.getElementById('image-input').click()">
          <div id="upload-preview">
            <p>鐐瑰嚮閫夋嫨鍥剧墖</p>
            <p class="hint">鏀寔 JPG銆丳NG銆乄ebP</p>
          </div>
        </div>
        <input type="file" id="image-input" accept="image/jpeg,image/png,image/webp">
        <div id="upload-status" class="upload-status"></div>
        <input type="hidden" id="prod-image" value="">
      </div>

      <button class="btn" onclick="saveProduct()">淇濆瓨鍟嗗搧</button>
      <button class="btn btn-secondary" onclick="cancelEdit()" style="display:none;" id="cancel-btn">鍙栨秷</button>
    </div>

    <!-- 鍙戝竷鎸夐挳 -->
    <button class="btn" onclick="publishToGitHub()" id="publish-btn">鍙戝竷鍒扮綉绔?/button>

    <!-- 褰撳墠鍟嗗搧鍒楄〃 -->
    <h2>褰撳墠鍟嗗搧</h2>
    <div class="product-list" id="product-list">
      <p style="color:#888;">鐐?鍔犺浇"鑾峰彇褰撳墠鍟嗗搧鏁版嵁</p>
    </div>
    <button class="btn btn-secondary" onclick="loadFromGitHub()" style="margin-top:8px;">浠?GitHub 鍔犺浇</button>
  </div>

  <script src="js/products.js"></script>
  <script>
    // ===== 鏈湴鍟嗗搧绠＄悊 =====
    let localProducts = [];

    // 鎭㈠ Token 鍜屽晢鍝?    window.onload = function() {
      const saved = localStorage.getItem('gh_token');
      if (saved) document.getElementById('github-token').value = saved;
      const savedProducts = localStorage.getItem('local_products');
      if (savedProducts) {
        try { localProducts = JSON.parse(savedProducts); renderLocalList(); } catch(e) {}
      }
    }

    // 鍥剧墖閫夋嫨 & 棰勮
    document.getElementById('image-input').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        const area = document.getElementById('upload-area');
        area.classList.add('has-image');
        document.getElementById('upload-preview').innerHTML =
          '<img src="' + ev.target.result + '"><p class="hint">' + file.name + '</p>';
        document.getElementById('prod-image').value = file.name;
        document.getElementById('upload-status').style.display = 'none';
      };
      reader.readAsDataURL(file);
    });

    function renderLocalList() {
      const el = document.getElementById('product-list');
      if (localProducts.length === 0) {
        el.innerHTML = '<p style="color:#888;">鏆傛棤鍟嗗搧</p>';
        return;
      }
      el.innerHTML = localProducts.map((p, i) => `
        <div class="item">
          <div class="info">
            <div class="name">${p.name}</div>
            <div class="meta">楼${p.price}${p.originalPrice ? ' 鍘熶环楼' + p.originalPrice : ''} | ${p.badge || '鏃犺鏍?}</div>
          </div>
          <div class="actions">
            <button class="btn btn-secondary" onclick="editProduct(${i})">缂栬緫</button>
            <button class="btn btn-danger" onclick="deleteProduct(${i})">鍒犻櫎</button>
          </div>
        </div>
      `).join('');
    }

    function saveProduct() {
      const id = document.getElementById('edit-id').value;
      const name = document.getElementById('prod-name').value.trim();
      const price = parseFloat(document.getElementById('prod-price').value);
      const original = document.getElementById('prod-original').value;
      const badge = document.getElementById('prod-badge').value.trim();
      const desc = document.getElementById('prod-desc').value.trim();
      const image = document.getElementById('prod-image').value.trim();

      if (!name || !price) { setStatus('璇疯嚦灏戝～鍐欏晢鍝佸悕绉板拰鍞环', 'error'); return; }

      const product = {
        id: id || ('product-' + Date.now()),
        name: name,
        price: price,
        description: desc || '鍟嗗搧鎻忚堪',
        images: [image || 'placeholder.svg']
      };
      if (original) product.originalPrice = parseFloat(original);
      if (badge) product.badge = badge;

      if (id && localProducts.find(p => p.id === id)) {
        const idx = localProducts.findIndex(p => p.id === id);
        localProducts[idx] = product;
        setStatus('鍟嗗搧宸叉洿鏂?, 'success');
      } else {
        localProducts.push(product);
        setStatus('鍟嗗搧宸叉坊鍔?, 'success');
      }

      localStorage.setItem('local_products', JSON.stringify(localProducts));
      clearForm();
      renderLocalList();
    }

    function editProduct(idx) {
      const p = localProducts[idx];
      document.getElementById('edit-id').value = p.id;
      document.getElementById('prod-name').value = p.name;
      document.getElementById('prod-price').value = p.price;
      document.getElementById('prod-original').value = p.originalPrice || '';
      document.getElementById('prod-badge').value = p.badge || '';
      document.getElementById('prod-desc').value = p.description || '';
      document.getElementById('prod-image').value = (p.images && p.images[0] !== 'placeholder.svg') ? p.images[0] : '';
      document.getElementById('form-title').textContent = '缂栬緫鍟嗗搧';
      document.getElementById('cancel-btn').style.display = 'inline-block';
      // 閲嶇疆鍥剧墖棰勮
      const area = document.getElementById('upload-area');
      area.classList.remove('has-image');
      document.getElementById('upload-preview').innerHTML = '<p>鐐瑰嚮閫夋嫨鏂板浘鐗?/p><p class="hint">涓嶉€夊垯淇濈暀鍘熷浘</p>';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteProduct(idx) {
      if (!confirm('纭畾鍒犻櫎杩欎釜鍟嗗搧锛?)) return;
      localProducts.splice(idx, 1);
      localStorage.setItem('local_products', JSON.stringify(localProducts));
      renderLocalList();
      setStatus('鍟嗗搧宸插垹闄?, 'success');
    }

    function cancelEdit() { clearForm(); }

    function clearForm() {
      document.getElementById('edit-id').value = '';
      document.getElementById('prod-name').value = '';
      document.getElementById('prod-price').value = '';
      document.getElementById('prod-original').value = '';
      document.getElementById('prod-badge').value = '';
      document.getElementById('prod-desc').value = '';
      document.getElementById('prod-image').value = '';
      document.getElementById('form-title').textContent = '娣诲姞鍟嗗搧';
      document.getElementById('cancel-btn').style.display = 'none';
      const area = document.getElementById('upload-area');
      area.classList.remove('has-image');
      document.getElementById('upload-preview').innerHTML = '<p>鐐瑰嚮閫夋嫨鍥剧墖</p><p class="hint">鏀寔 JPG銆丳NG銆乄ebP</p>';
      document.getElementById('upload-status').style.display = 'none';
    }

    // ===== 淇濆瓨 Token =====
    function getToken() {
      const token = document.getElementById('github-token').value.trim();
      if (!token) { setStatus('璇峰厛杈撳叆 GitHub Token', 'error'); return null; }
      localStorage.setItem('gh_token', token);
      return token;
    }

    function setStatus(msg, type) {
      const el = document.getElementById('status-msg');
      el.textContent = msg;
      el.className = 'status-msg ' + type;
    }

    // ===== 涓婁紶鍥剧墖鍒?GitHub =====
    async function uploadImage(file, token) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = async function(ev) {
          try {
            const base64 = ev.target.result.split(',')[1];
            const fileName = Date.now() + '-' + file.name.replace(/[^a-zA-Z0-9.-]/g, '_');

            // 妫€鏌ユ枃浠舵槸鍚﹀瓨鍦?            const checkResp = await fetch('https://api.github.com/repos/kkkill-pp/store-site/contents/images/' + fileName, {
              headers: { 'Authorization': 'token ' + token }
            });
            const checkData = await checkResp.json();
            const sha = checkData.sha || null;

            // 涓婁紶/瑕嗙洊
            const putBody = {
              message: '涓婁紶鍥剧墖 ' + fileName,
              content: base64
            };
            if (sha) putBody.sha = sha;

            const putResp = await fetch('https://api.github.com/repos/kkkill-pp/store-site/contents/images/' + fileName, {
              method: 'PUT',
              headers: {
                'Authorization': 'token ' + token,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify(putBody)
            });

            if (putResp.ok) {
              resolve(fileName);
            } else {
              const err = await putResp.json();
              reject(err.message);
            }
          } catch(e) {
            reject(e.message);
          }
        };
        reader.readAsDataURL(file);
      });
    }

    // ===== 鍙戝竷鍒?GitHub =====
    async function publishToGitHub() {
      const token = getToken();
      if (!token) return;
      if (localProducts.length === 0) { setStatus('娌℃湁鍟嗗搧鍙彂甯?, 'error'); return; }

      setStatus('姝ｅ湪鍙戝竷...', 'loading');
      document.getElementById('publish-btn').disabled = true;

      try {
        // 鑾峰彇褰撳墠 products.js 鐨?SHA
        const repoUrl = 'https://api.github.com/repos/kkkill-pp/store-site';
        const getResp = await fetch(repoUrl + '/contents/js/products.js', {
          headers: { 'Authorization': 'token ' + token }
        });
        const getData = await getResp.json();
        if (getData.message) { setStatus('鍔犺浇澶辫触锛? + getData.message, 'error'); document.getElementById('publish-btn').disabled = false; return; }

        const sha = getData.sha;

        // 鐢熸垚鏂?products.js
        const jsContent = generateProductsJS(localProducts);

        // 鎻愪氦鏇存柊
        const putResp = await fetch(repoUrl + '/contents/js/products.js', {
          method: 'PUT',
          headers: { 'Authorization': 'token ' + token, 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: '鏇存柊鍟嗗搧鏁版嵁',
            content: btoa(unescape(encodeURIComponent(jsContent))),
            sha: sha
          })
        });

        if (putResp.ok) {
          setStatus('鍙戝竷鎴愬姛锛佺綉绔?1-2 鍒嗛挓鍚庤嚜鍔ㄦ洿鏂?, 'success');
        } else {
          const err = await putResp.json();
          setStatus('鍙戝竷澶辫触锛? + (err.message || '鏈煡閿欒'), 'error');
        }
      } catch(e) {
        setStatus('缃戠粶閿欒锛? + e.message, 'error');
      } finally {
        document.getElementById('publish-btn').disabled = false;
      }
    }

    // 甯﹀浘鐗囦笂浼犵殑鍙戝竷
    async function saveAndPublishWithImage() {
      const fileInput = document.getElementById('image-input');
      const file = fileInput.files[0];
      const token = getToken();
      if (!token) return;

      if (!file) {
        // 娌￠€夋柊鍥剧墖锛岀洿鎺ヤ繚瀛樺晢鍝佹暟鎹?        saveProduct();
        return;
      }

      setStatus('姝ｅ湪涓婁紶鍥剧墖...', 'loading');

      try {
        const fileName = await uploadImage(file, token);
        document.getElementById('prod-image').value = fileName;
        document.getElementById('upload-status').textContent = '鉁?鍥剧墖宸蹭笂浼?;
        document.getElementById('upload-status').style.display = 'block';
        saveProduct();
      } catch(e) {
        setStatus('鍥剧墖涓婁紶澶辫触锛? + e, 'error');
      }
    }

    async function loadFromGitHub() {
      const token = getToken();
      if (!token) return;

      setStatus('姝ｅ湪鍔犺浇...', 'loading');

      try {
        const resp = await fetch('https://api.github.com/repos/kkkill-pp/store-site/contents/js/products.js', {
          headers: { 'Authorization': 'token ' + token }
        });
        const data = await resp.json();
        if (data.message) { setStatus('鍔犺浇澶辫触锛? + data.message, 'error'); return; }

        const content = decodeURIComponent(escape(atob(data.content)));
        const match = content.match(/const products\s*=\s*(\[[\s\S]*?\]);/);
        if (match) {
          localProducts = eval(match[1]);
          localStorage.setItem('local_products', JSON.stringify(localProducts));
          renderLocalList();
          setStatus('宸插姞杞?' + localProducts.length + ' 涓晢鍝?, 'success');
        } else {
          setStatus('瑙ｆ瀽澶辫触锛氭壘涓嶅埌鍟嗗搧鏁版嵁', 'error');
        }
      } catch(e) {
        setStatus('鍔犺浇澶辫触锛? + e.message, 'error');
      }
    }

    function generateProductsJS(products) {
      const items = products.map(p => {
        const lines = ['    {'];
        lines.push("      id: '" + p.id + "',");
        lines.push("      name: '" + (p.name || '').replace(/'/g, "\\'") + "',");
        lines.push('      price: ' + p.price + ',');
        if (p.originalPrice) lines.push('      originalPrice: ' + p.originalPrice + ',');
        if (p.badge) lines.push("      badge: '" + (p.badge || '').replace(/'/g, "\\'") + "',");
        lines.push("      description: '" + (p.description || '').replace(/'/g, "\\'") + "',");
        const img = (p.images && p.images[0]) ? p.images[0] : 'placeholder.svg';
        lines.push("      images: ['" + img + "']");
        lines.push('    }');
        return lines.join('\n');
      });

      return (
`// ===== 浜у搧鏁版嵁 =====
// 鍦?https://kkkill-pp.github.io/store-site/admin.html 涓婄鐞?
const products = [
${items.join(',\n')}
];

// 娓叉煋鍑芥暟
function renderProductCard(product) {
  const imgFile = product.images && product.images[0] ? product.images[0] : 'placeholder.svg';
  return \`
    <a href="product.html?id=\${product.id}" class="product-card">
      <img src="images/\${imgFile}" alt="\${product.name}">
      <div class="info">
        \${product.badge ? \`<span class="badge">\${product.badge}</span>\` : ''}
        <h3>\${product.name}</h3>
        <span class="price">楼\${product.price}</span>
        \${product.originalPrice ? \`<span class="original-price">楼\${product.originalPrice}</span>\` : ''}
      </div>
    </a>
  \`;
}

function renderProducts(productList, elementId) {
  const container = document.getElementById(elementId);
  if (!container) return;
  container.innerHTML = productList.map(p => renderProductCard(p)).join('');
}
`);
    }
  </script>
</body>
</html>
