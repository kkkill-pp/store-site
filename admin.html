<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品管理 | 管理员</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .admin-wrap { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
    .admin-wrap h1 { margin-bottom: 24px; }
    .admin-wrap h2 { margin: 32px 0 16px; font-size: 1.2rem; }

    .token-bar {
      background: #fff3cd; border: 1px solid #ffc107; border-radius: 8px;
      padding: 16px; margin-bottom: 24px;
    }
    .token-bar label { display: block; margin-bottom: 8px; font-weight: 600; }
    .token-bar input { width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.9rem; }
    .token-bar .hint { font-size: 0.8rem; color: #856404; margin-top: 6px; }

    .admin-form { background: #f8f9fa; border-radius: 10px; padding: 24px; margin-bottom: 24px; }
    .admin-form .row { margin-bottom: 12px; }
    .admin-form label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 0.9rem; }
    .admin-form input, .admin-form textarea {
      width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.95rem;
    }
    .admin-form textarea { min-height: 60px; resize: vertical; }
    .admin-form .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .admin-form .row-3 { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 12px; }

    .admin-form .btn { margin-top: 12px; }
    .btn-secondary { background: #6c757d; }
    .btn-secondary:hover { background: #5a6268; }
    .btn-danger { background: #dc3545; }
    .btn-danger:hover { background: #c82333; }

    .product-list .item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px; border: 1px solid #eee; border-radius: 8px; margin-bottom: 8px;
    }
    .product-list .item .info { flex: 1; }
    .product-list .item .name { font-weight: 600; }
    .product-list .item .meta { font-size: 0.85rem; color: #888; }
    .product-list .item .actions { display: flex; gap: 8px; }
    .product-list .item .actions button { padding: 4px 12px; font-size: 0.85rem; }

    .status-msg { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; display: none; }
    .status-msg.success { background: #d4edda; color: #155724; display: block; }
    .status-msg.error { background: #f8d7da; color: #721c24; display: block; }
    .status-msg.loading { background: #cce5ff; color: #004085; display: block; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">品牌名</a>
      <ul class="nav-links">
        <li><a href="index.html">首页</a></li>
        <li><a href="products.html">商品</a></li>
        <li><a href="admin.html" style="color:#e63946;">管理</a></li>
      </ul>
    </div>
  </nav>

  <div class="admin-wrap">
    <h1>商品管理</h1>

    <!-- Token -->
    <div class="token-bar">
      <label>GitHub Token（需要 repo 权限）</label>
      <input type="password" id="github-token" placeholder="输入你的 GitHub Personal Access Token">
      <div class="hint">Token 只存在你浏览器里，不会发到其他地方。</div>
    </div>

    <div id="status-msg" class="status-msg"></div>

    <!-- 添加/编辑表单 -->
    <div class="admin-form" id="product-form">
      <h2 id="form-title">添加商品</h2>
      <input type="hidden" id="edit-id" value="">
      <div class="row">
        <label>商品名称</label>
        <input type="text" id="prod-name" placeholder="示例商品 1">
      </div>
      <div class="row-3">
        <div>
          <label>售价 (¥)</label>
          <input type="number" id="prod-price" placeholder="128">
        </div>
        <div>
          <label>原价 (¥)</label>
          <input type="number" id="prod-original" placeholder="188（留空无原价）">
        </div>
        <div>
          <label>角标</label>
          <input type="text" id="prod-badge" placeholder="SAVE 30%（留空无角标）">
        </div>
      </div>
      <div class="row">
        <label>商品描述</label>
        <textarea id="prod-desc" placeholder="商品描述文字"></textarea>
      </div>
      <div class="row">
        <label>图片文件名（放 images/ 文件夹）</label>
        <input type="text" id="prod-image" placeholder="plushie-red.png">
      </div>
      <button class="btn" onclick="saveProduct()">保存商品</button>
      <button class="btn btn-secondary" onclick="cancelEdit()" style="display:none;" id="cancel-btn">取消</button>
    </div>

    <!-- 发布到 GitHub -->
    <button class="btn" onclick="publishToGitHub()" id="publish-btn">发布到网站</button>

    <!-- 当前商品列表 -->
    <h2>当前商品</h2>
    <div class="product-list" id="product-list">
      <p style="color:#888;">点击"从 GitHub 加载"获取当前商品</p>
    </div>
    <button class="btn btn-secondary" onclick="loadFromGitHub()" style="margin-top:8px;">从 GitHub 加载</button>
  </div>

  <script src="js/products.js"></script>
  <script>
    // ===== 本地编辑 =====
    let localProducts = [];

    function renderLocalList() {
      const el = document.getElementById('product-list');
      if (localProducts.length === 0) {
        el.innerHTML = '<p style="color:#888;">暂无商品</p>';
        return;
      }
      el.innerHTML = localProducts.map((p, i) => `
        <div class="item">
          <div class="info">
            <div class="name">${p.name}</div>
            <div class="meta">¥${p.price}${p.originalPrice ? ` 原价¥${p.originalPrice}` : ''} | ${p.badge ? p.badge : '无角标'} | 图片: ${p.images[0] || '无'}</div>
          </div>
          <div class="actions">
            <button class="btn btn-secondary" onclick="editProduct(${i})">编辑</button>
            <button class="btn btn-danger" onclick="deleteProduct(${i})">删除</button>
          </div>
        </div>
      `).join('');
    }

    function saveProduct() {
      const id = document.getElementById('edit-id').value;
      const name = document.getElementById('prod-name').value.trim();
      const price = parseFloat(document.getElementById('prod-price').value);
      const original = document.getElementById('prod-original').value;
      const badge = document.getElementById('prod-badge').value.trim();
      const desc = document.getElementById('prod-desc').value.trim();
      const image = document.getElementById('prod-image').value.trim();

      if (!name || !price) { setStatus('请至少填写商品名称和售价', 'error'); return; }

      const product = {
        id: id || ('product-' + Date.now()),
        name: name,
        price: price,
        description: desc || '商品描述',
        images: [image || 'placeholder.svg']
      };
      if (original) product.originalPrice = parseFloat(original);
      if (badge) product.badge = badge;

      if (id && localProducts.find(p => p.id === id)) {
        // 编辑
        const idx = localProducts.findIndex(p => p.id === id);
        localProducts[idx] = product;
        setStatus('商品已更新', 'success');
      } else {
        // 新增
        localProducts.push(product);
        setStatus('商品已添加', 'success');
      }

      clearForm();
      renderLocalList();
    }

    function editProduct(idx) {
      const p = localProducts[idx];
      document.getElementById('edit-id').value = p.id;
      document.getElementById('prod-name').value = p.name;
      document.getElementById('prod-price').value = p.price;
      document.getElementById('prod-original').value = p.originalPrice || '';
      document.getElementById('prod-badge').value = p.badge || '';
      document.getElementById('prod-desc').value = p.description || '';
      document.getElementById('prod-image').value = (p.images && p.images[0] !== 'placeholder.svg') ? p.images[0] : '';
      document.getElementById('form-title').textContent = '编辑商品';
      document.getElementById('cancel-btn').style.display = 'inline-block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteProduct(idx) {
      if (!confirm('确定删除这个商品？')) return;
      localProducts.splice(idx, 1);
      renderLocalList();
      setStatus('商品已删除', 'success');
    }

    function cancelEdit() {
      clearForm();
    }

    function clearForm() {
      document.getElementById('edit-id').value = '';
      document.getElementById('prod-name').value = '';
      document.getElementById('prod-price').value = '';
      document.getElementById('prod-original').value = '';
      document.getElementById('prod-badge').value = '';
      document.getElementById('prod-desc').value = '';
      document.getElementById('prod-image').value = '';
      document.getElementById('form-title').textContent = '添加商品';
      document.getElementById('cancel-btn').style.display = 'none';
    }

    // ===== GitHub 发布 =====
    function getToken() {
      const token = document.getElementById('github-token').value.trim();
      if (!token) { setStatus('请先输入 GitHub Token', 'error'); return null; }
      return token;
    }

    function setStatus(msg, type) {
      const el = document.getElementById('status-msg');
      el.textContent = msg;
      el.className = 'status-msg ' + type;
    }

    async function publishToGitHub() {
      const token = getToken();
      if (!token) return;

      if (localProducts.length === 0) { setStatus('没有商品可发布', 'error'); return; }

      setStatus('正在发布...', 'loading');
      document.getElementById('publish-btn').disabled = true;

      try {
        // 1. 获取当前 products.js 的 SHA
        const repoUrl = 'https://api.github.com/repos/kkkill-pp/store-site';
        const filePath = 'js/products.js';

        const getResp = await fetch(`${repoUrl}/contents/${filePath}`, {
          headers: { 'Authorization': `token ${token}` }
        });
        const getData = await getResp.json();
        const sha = getData.sha;

        // 2. 生成新的 products.js 内容
        const jsContent = generateProductsJS(localProducts);

        // 3. 提交更新
        const putResp = await fetch(`${repoUrl}/contents/${filePath}`, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: '更新商品',
            content: btoa(unescape(encodeURIComponent(jsContent))),
            sha: sha
          })
        });

        if (putResp.ok) {
          setStatus('发布成功！网站 1-2 分钟后自动更新', 'success');
        } else {
          const err = await putResp.json();
          setStatus('发布失败：' + (err.message || '未知错误'), 'error');
        }
      } catch(e) {
        setStatus('网络错误：' + e.message, 'error');
      } finally {
        document.getElementById('publish-btn').disabled = false;
      }
    }

    async function loadFromGitHub() {
      const token = getToken();
      if (!token) return;

      setStatus('正在加载...', 'loading');

      try {
        const resp = await fetch('https://api.github.com/repos/kkkill-pp/store-site/contents/js/products.js', {
          headers: { 'Authorization': `token ${token}` }
        });
        const data = await resp.json();
        if (data.message) { setStatus('加载失败：' + data.message, 'error'); return; }

        // 解码
        const content = decodeURIComponent(escape(atob(data.content)));
        // 提取 products 数组 - 从 const products = [ 到 ];
        const match = content.match(/const products\s*=\s*(\[[\s\S]*?\]);/);
        if (match) {
          localProducts = eval(match[1]);
          renderLocalList();
          setStatus('已加载 ' + localProducts.length + ' 个商品', 'success');
        } else {
          setStatus('解析失败：找不到商品数据', 'error');
        }
      } catch(e) {
        setStatus('加载失败：' + e.message, 'error');
      }
    }

    function generateProductsJS(products) {
      const items = products.map(p => {
        const lines = [`    {`];
        lines.push(`      id: '${p.id}',`);
        lines.push(`      name: '${p.name.replace(/'/g, "\\'")}',`);
        lines.push(`      price: ${p.price},`);
        if (p.originalPrice) lines.push(`      originalPrice: ${p.originalPrice},`);
        if (p.badge) lines.push(`      badge: '${p.badge.replace(/'/g, "\\'")}',`);
        lines.push(`      description: '${(p.description || '').replace(/'/g, "\\'")}',`);
        const img = (p.images && p.images[0]) ? p.images[0] : 'placeholder.svg';
        lines.push(`      images: ['${img}']`);
        lines.push(`    }`);
        return lines.join('\n');
      });

      return `// ===== 产品数据 =====\n// 在 https://kkkill-pp.github.io/store-site/admin.html 上管理\n\nconst products = [\n${items.join(',\n')}\n];\n\n// 渲染函数\nfunction renderProductCard(product) {\n  const imgFile = product.images && product.images[0] ? product.images[0] : 'placeholder.svg';\n  return \`\n    <a href="product.html?id=\${product.id}" class="product-card">\n      <img src="images/\${imgFile}" alt="\${product.name}">\n      <div class="info">\n        \${product.badge ? \`<span class="badge">\${product.badge}</span>\` : ''}\n        <h3>\${product.name}</h3>\n        <span class="price">¥\${product.price}</span>\n        \${product.originalPrice ? \`<span class="original-price">¥\${product.originalPrice}</span>\` : ''}\n      </div>\n    </a>\n  \`;\n}\n\nfunction renderProducts(productList, elementId) {\n  const container = document.getElementById(elementId);\n  if (!container) return;\n  container.innerHTML = productList.map(p => renderProductCard(p)).join('');\n}\n`;
    }
  </script>
</body>
</html>
