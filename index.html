<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>首页 | 品牌名称</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 导航 -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">品牌名</a>
      <ul class="nav-links">
        <li><a href="index.html">首页</a></li>
        <li><a href="products.html">商品</a></li>

  <!-- 页脚 -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 品牌名称</p>
    </div>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script>
    // 首页展示前 4 个商品
    renderProducts(products.slice(0, 4), 'featured-products');
    updateCartCount();
