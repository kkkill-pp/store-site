<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品详情 | 品牌名称</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">品牌名</a>
      <ul class="nav-links">
        <li><a href="index.html">首页</a></li>
        <li><a href="products.html">商品</a></li>
        <li><a href="about.html">关于</a></li>
        <li><a href="cart.html" class="cart-link">购物车 <span id="cart-count">0</span></a></li>
      </ul>
    </div>
  </nav>

  <section class="product-detail">
    <div class="container">
      <div class="detail-layout" id="product-detail">
        <!-- JS 渲染 -->
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 品牌名称</p>
    </div>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const product = products.find(p => p.id === id);

    if (product) {
      const container = document.getElementById('product-detail');
      const imgFile = product.images && product.images[0] ? product.images[0] : 'placeholder.svg';
      container.innerHTML = `
        <div class="detail-image">
          <img src="images/${imgFile}" alt="${product.name}">
        </div>
        <div class="detail-info">
          <h1>${product.name}</h1>
          <p class="price">¥${product.price}</p>
          ${product.originalPrice ? `<p class="original-price">原价 ¥${product.originalPrice}</p>` : ''}
          <p class="desc">${product.description || '商品描述'}</p>
          <button class="btn" onclick="addToCart('${product.id}')">加入购物车</button>
        </div>
      `;
      updateCartCount();
    } else {
      document.getElementById('product-detail').innerHTML = '<p>商品不存在</p>';
    }
  </script>
</body>
</html>
